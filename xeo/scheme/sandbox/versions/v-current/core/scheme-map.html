<style>
:root { --xv-bg: #f6f6f7; --xv-surface: #ffffff; --xv-surface-2: #f1f1f3; --xv-line: #e4e4e7; --xv-line-strong: #d4d4d8; --xv-text: #18181b; --xv-muted: #63636e; --xv-faint: #a1a1aa; --xv-on-zone: #ffffff; --xv-accent: #2563eb; --xv-accent-quiet: #e0eafd; --xv-match: #f2b200; --xv-code-string: #a1501b; --xv-code-type: #0f7f77; --xv-zone-scheme: #2563eb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { color-scheme: dark; --xv-bg: #0c0c0e; --xv-surface: #151518; --xv-surface-2: #1f1f23; --xv-line: #2a2a2f; --xv-line-strong: #3a3a41; --xv-text: #f2f2f3; --xv-muted: #a3a3ad; --xv-faint: #6c6c75; --xv-on-zone: #0c0c0e; --xv-accent: #6ea2ff; --xv-accent-quiet: #1a2944; --xv-match: #f4c64a; --xv-code-string: #f0a868; --xv-code-type: #5fd4c4; --xv-zone-scheme: #60a5fa; } }
:root[data-theme='dark'] { color-scheme: dark; --xv-bg: #0c0c0e; --xv-surface: #151518; --xv-surface-2: #1f1f23; --xv-line: #2a2a2f; --xv-line-strong: #3a3a41; --xv-text: #f2f2f3; --xv-muted: #a3a3ad; --xv-faint: #6c6c75; --xv-on-zone: #0c0c0e; --xv-accent: #6ea2ff; --xv-accent-quiet: #1a2944; --xv-match: #f4c64a; --xv-code-string: #f0a868; --xv-code-type: #5fd4c4; --xv-zone-scheme: #60a5fa; }

.xv-map { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
.xv-zone-bg { fill: color-mix(in srgb, var(--z) 7%, var(--xv-bg)); stroke: color-mix(in srgb, var(--z) 32%, var(--xv-bg)); stroke-width: 1; }
.xv-zone-title { font: 600 20px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: var(--z); letter-spacing: -0.01em; }
.xv-zone-meta { font: 500 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: var(--xv-muted); letter-spacing: 0; }
.xv-file-bg { fill: color-mix(in srgb, var(--z) 2%, var(--xv-surface)); stroke: color-mix(in srgb, var(--z) 40%, var(--xv-surface)); stroke-width: 1; stroke-dasharray: 4 3; }
.xv-file-label { font-size: 11px; font-weight: 600; fill: var(--z); }
.xv-file-label .ns { font-weight: 400; fill: var(--xv-muted); }
.xv-edge { color: var(--z); }
.xv-edge-line { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; opacity: 0.9; }
.xv-edge.xv-soft .xv-edge-line { stroke-dasharray: 5 4; }
.xv-edge.xv-own .xv-edge-line { stroke-width: 2; }
.xv-edge-end { fill: currentColor; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
.xv-edge-end.hollow { fill: var(--xv-surface); }
.xv-edge-end.open { fill: none; }
.xv-edge-hit { fill: none; stroke: transparent; stroke-width: 9; }
.xv-card-bg { fill: var(--xv-surface); stroke: color-mix(in srgb, var(--z) 50%, var(--xv-line)); stroke-width: 1; }
.xv-card-head { fill: var(--z); }
.xv-card-title { font-size: 13px; font-weight: 600; fill: var(--xv-on-zone); }
.xv-card-badge { font-size: 10px; font-weight: 500; fill: var(--xv-on-zone); opacity: 0.85; }
.xv-row-sep { stroke: color-mix(in srgb, var(--z) 10%, var(--xv-line)); stroke-width: 1; }
.xv-row-bg { fill: transparent; }
.xv-row text { font-size: 11px; }
.xv-row-label { fill: var(--xv-text); }
.xv-row-label .q { fill: var(--xv-muted); }
.xv-row-detail { fill: var(--xv-muted); }
.xv-row-detail.rel { fill: var(--t); font-weight: 500; }
.xv-row.id .xv-row-label { font-weight: 600; }
.xv-row.block .xv-row-label, .xv-row.variant .xv-row-label { font-weight: 600; }
.xv-row.block .xv-row-detail, .xv-row.variant .xv-row-detail { font-style: italic; }
.xv-block-box { stroke: color-mix(in srgb, var(--z) 45%, var(--xv-line)); stroke-width: 1; }
.xv-block-rule { stroke: color-mix(in srgb, var(--z) 45%, var(--xv-line)); stroke-width: 1; }
.xv-row.block .xv-row-label { fill: color-mix(in srgb, var(--z) 70%, var(--xv-text)); }
.xv-variant-band { fill: color-mix(in srgb, var(--z) 14%, var(--xv-surface)); }
.xv-card-far { display: none; font-weight: 600; fill: var(--xv-text); dominant-baseline: hanging; font-size: min(var(--fit), calc(13px * var(--xv-inv, 1))); }


* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--xv-bg); color: var(--xv-text); font: 400 13px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
code { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 0.92em; background: var(--xv-surface-2); padding: 1px 4px; border-radius: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--xv-accent); outline-offset: 1px; }

.xv-app { position: fixed; inset: 0; }
.xv-stage { position: absolute; inset: 0; overflow: hidden; background: var(--xv-bg); cursor: grab; touch-action: none; user-select: none; }
.xv-stage.is-panning { cursor: grabbing; }
.xv-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Плавающие подложки поверх карты, как в Miro: карта занимает всё окно */
.xv-float { position: absolute; top: 12px; z-index: 6; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px; background: var(--xv-surface); border-radius: 8px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--xv-text) 7%, transparent), 0 2px 6px rgb(0 0 0 / 0.06), 0 8px 24px rgb(0 0 0 / 0.07); cursor: auto; user-select: none; }
.xv-float-left { left: 12px; }
.xv-float-right { right: 12px; }
.xv-divider { width: 1px; height: 22px; margin: 0 2px; background: var(--xv-line); flex: none; }
.xv-meta { padding: 0 8px 0 2px; color: var(--xv-muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.xv-ctl-label { padding-left: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--xv-muted); }
.xv-seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--xv-surface-2); border-radius: 7px; }
.xv-seg button { height: 28px; border: 0; background: transparent; color: var(--xv-muted); font-size: 12px; font-weight: 500; line-height: 1; padding: 0 10px; border-radius: 5px; cursor: pointer; }
.xv-seg button:hover { color: var(--xv-text); }
.xv-seg button[aria-pressed='true'] { background: var(--xv-surface); color: var(--xv-text); box-shadow: 0 0 0 1px var(--xv-line), 0 1px 2px rgb(0 0 0 / 0.06); }
.xv-tool { height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; }
.xv-tool:hover { background: var(--xv-surface-2); }
.xv-tool[aria-expanded='true'] { background: var(--xv-accent-quiet); color: var(--xv-accent); }
.xv-search { position: relative; display: flex; align-items: center; }
.xv-search-icon { position: absolute; left: 10px; color: var(--xv-faint); pointer-events: none; }
.xv-search input { width: 260px; height: 32px; padding: 0 40px 0 32px; border: 0; border-radius: 6px; background: var(--xv-surface-2); color: var(--xv-text); font: 13px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.xv-search input::placeholder { color: var(--xv-faint); }
.xv-search-count { position: absolute; right: 10px; font: 500 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; color: var(--xv-muted); pointer-events: none; }
.xv-zoom { position: absolute; left: 12px; bottom: 12px; padding: 3px 8px; border-radius: 4px; background: color-mix(in srgb, var(--xv-surface) 88%, transparent); color: var(--xv-muted); font: 500 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; pointer-events: none; }

.xv-map .xv-card, .xv-map .xv-edge { cursor: pointer; transition: opacity 0.12s; }
.xv-map .xv-row:hover .xv-row-bg { fill: color-mix(in srgb, var(--xv-accent) 8%, transparent); }
.xv-map.has-focus .xv-edge:not(.is-on) { opacity: 0.07; }
.xv-map.has-focus .xv-card:not(.is-on) { opacity: 0.3; }
.xv-map .xv-edge.is-on .xv-edge-line { stroke-width: 2.4; opacity: 1; }
.xv-map .xv-edge.xv-own.is-on .xv-edge-line { stroke-width: 3; }
.xv-map .xv-card.is-selected .xv-card-bg { stroke: var(--xv-accent); stroke-width: 2.5; }
.xv-map.has-search .xv-card:not(.match) { opacity: 0.25; }
.xv-map .xv-card.match .xv-card-bg { stroke: var(--xv-match); stroke-width: 3; }
.xv-map .xv-row.match .xv-row-bg { fill: color-mix(in srgb, var(--xv-match) 35%, transparent); }
.xv-map.is-locked .xv-card:not(.is-on) { opacity: 0.16; cursor: default; }
.xv-map.is-locked .xv-card:not(.is-on) .xv-row:hover .xv-row-bg { fill: transparent; }
.xv-map.is-locked .xv-edge:not(.is-on) { opacity: 0.04; pointer-events: none; }
.xv-map .xv-row.is-pinned .xv-row-bg { fill: color-mix(in srgb, var(--xv-accent) 24%, transparent); stroke: var(--xv-accent); stroke-width: 1; }
.xv-map .xv-row.is-pinned .xv-row-label { fill: var(--xv-accent); font-weight: 600; }
.xv-map .xv-row.is-linked .xv-row-bg { fill: color-mix(in srgb, var(--xv-accent) 12%, transparent); }
.xv-map .xv-edges[data-layer='nohub'] { visibility: hidden; }
.xv-map.mode-shortcuts .xv-edges[data-layer='all'] { visibility: hidden; }
.xv-map.mode-shortcuts .xv-edges[data-layer='nohub'] { visibility: visible; }
.xv-map.mode-shortcuts .xv-edges[data-layer='all'] .xv-edge.xv-hub.is-on { visibility: visible; }
.xv-map.lod-far .xv-row, .xv-map.lod-far .xv-card-title, .xv-map.lod-far .xv-card-badge, .xv-map.lod-far .xv-file-label { display: none; }
.xv-map.lod-far .xv-card-far { display: inline; }
.xv-map.lod-far .xv-zone-title { font-size: clamp(20px, calc(16px * var(--xv-inv, 1)), 76px); }
.xv-map.lod-far .xv-zone-meta { font-size: clamp(12px, calc(10px * var(--xv-inv, 1)), 36px); }
.xv-map.lod-far .xv-edge-line { stroke-width: 2.6; }

.xv-legend { position: absolute; top: 64px; right: 12px; z-index: 5; width: 320px; max-width: calc(100% - 24px); max-height: calc(100% - 76px); overflow: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 16px; background: var(--xv-surface); border: 1px solid var(--xv-line-strong); border-radius: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.12); cursor: auto; user-select: text; }
.xv-legend section h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--xv-muted); }
.lg-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.lg-close { width: 26px; height: 26px; border: 0; border-radius: 5px; background: none; color: var(--xv-muted); font-size: 18px; line-height: 1; cursor: pointer; }
.lg-close:hover { background: var(--xv-surface-2); color: var(--xv-text); }
.quiet { color: var(--xv-muted); font-size: 12px; margin: 0; }
.zone-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--t); flex: none; }
.ent-link { padding: 0; border: 0; background: none; color: var(--t, var(--xv-accent)); font: 600 12px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; cursor: pointer; }
.ent-link:hover { text-decoration: underline; }
.del { display: inline-block; padding: 0 5px; border: 1px solid currentColor; border-radius: 3px; font: 500 10px/16px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; color: var(--xv-text); }
.del.cascade { color: #d62828; }
.del.set-null, .del.unlink { color: var(--xv-muted); border-style: dashed; }
.legend { display: flex; flex-direction: column; gap: 6px; }
.lg { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12px; color: var(--xv-muted); }
.lg span { color: var(--xv-text); }
.lg small { display: block; color: var(--xv-muted); font-size: 11px; }
.zones { display: flex; flex-direction: column; gap: 1px; margin: 0 -6px; }
.zone-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 5px 6px; border: 0; border-radius: 5px; background: none; text-align: left; cursor: pointer; font-size: 13px; }
.zone-row:hover { background: var(--xv-surface-2); }
.zone-row .zone-dot { width: 10px; height: 10px; }
.keys { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--xv-muted); }
kbd { display: inline-block; min-width: 18px; padding: 0 5px; margin-right: 6px; border: 1px solid var(--xv-line-strong); border-bottom-width: 2px; border-radius: 4px; font: 500 11px/18px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; color: var(--xv-text); text-align: center; }
.foot { font-size: 11px; }

.xv-tip { position: fixed; z-index: 50; max-width: 520px; max-height: calc(100vh - 16px); overflow: hidden; padding: 8px 10px; border: 1px solid var(--xv-line-strong); border-radius: 6px; background: var(--xv-surface); box-shadow: 0 8px 24px rgb(0 0 0 / 0.14); font-size: 12px; line-height: 1.5; pointer-events: none; }
.xv-tip b { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-weight: 600; }
.xv-tip .muted { color: var(--xv-muted); }
.xv-tip .tip-code { margin: 6px 0 2px; padding: 5px 7px; border-radius: 4px; background: var(--xv-surface-2); font: 11px/1.5 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; color: var(--xv-text); overflow-wrap: anywhere; }
.xv-tip .tip-dec { color: var(--xv-accent); font-weight: 600; }
.xv-tip .tip-zone { font-weight: 600; }
.xv-tip .tip-doc { margin: 6px 0; line-height: 1.5; white-space: pre-line; }
.xv-tip .tip-meta { color: var(--xv-muted); }
.xv-tip .tip-impact { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--xv-line); display: flex; flex-direction: column; gap: 3px; }
.xv-tip code { font-size: 11px; }
.xv-tip .tip-pre { margin: 6px 0 2px; padding: 7px 9px; border-radius: 4px; background: var(--xv-surface-2); font: 11px/1.5 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; color: var(--xv-text); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
.xv-tip .ts-c { color: var(--xv-muted); font-style: italic; }
.xv-tip .ts-s { color: var(--xv-code-string); }
.xv-tip .ts-k { color: var(--xv-accent); }
.xv-tip .ts-t { color: var(--xv-code-type); }

@media (max-width: 720px) {
  .xv-float-left { right: 12px; }
  .xv-float-left .xv-divider, .xv-meta { display: none; }
  .xv-search, .xv-search input { width: 100%; }
  .xv-search { flex: 1; }
  .xv-float-right { top: 64px; }
  .xv-legend { top: 116px; max-height: calc(100% - 128px); }
}
@media (prefers-reduced-motion: reduce) {
  .xv-map .xv-card, .xv-map .xv-edge { transition: none; }
}
</style>

    const typeCodeHtml = (field) => {
        if (!field.typeRefs)
            return '';
        const blocks = [`${field.name}: ${field.tsType ?? 'unknown'}`];
        let lines = 1;
        let skipped = 0;
        for (const id of field.typeRefs) {
            const text = DATA.types[id];
            if (!text)
                continue;
            const count = text.split('\n').length;
            if (lines + count > MAX_CODE_LINES) {
                skipped++;
                continue;
            }
            blocks.push(text);
            lines += count + 1;
        }
        if (skipped)
            blocks.push(`// … ещё ${plural(skipped, ['объявление', 'объявления', 'объявлений'])}`);
        return `<pre class="tip-pre">${highlightTs(blocks.join('\n\n'))}</pre>`;
    };
    const fieldTip = (key, path) => {
        const entity = byKey.get(key);
        if (!entity)
            return '';
        if (path.startsWith('@')) {
            const variant = entity.variants.find((v) => `@${v.value}` === path);
            if (!variant)
                return '';
            return (`<b>${esc(entity.discriminatorKey)} = ${esc(variant.value)}</b> <span class="muted">${esc(variant.model)}</span>` +
                `<div class="muted">поля ниже есть только у этого варианта</div>` +
                decoratorHtml(variant.decorators) +
                (variant.doc ? `<div>${md(variant.doc)}</div>` : ''));
        }
        const field = fieldIndex.get(key)?.get(path);
        if (!field)
            return '';
        const type = field.kind === 'embedded'
            ? `embedded · ${field.type ?? ''}`
            : field.kind === 'id'
                ? `PK · ${field.type ?? ''}`
                : displayType(field);
        return (`<b>${esc(key)}.${esc(path)}</b>${field.nullable ? '<span class="muted">?</span>' : ''} <span class="muted">${esc(type)}</span>` +
            decoratorHtml(field.decorators) +
            typeCodeHtml(field) +
            (field.kind === 'embedded'
                ? '<div class="muted">часть документа, не отдельная коллекция</div>'
                : '') +
            (field.values ? `<div class="muted">${field.values.map(esc).join(' | ')}</div>` : '') +
            (field.doc ? `<div class="tip-doc">${md(field.doc)}</div>` : ''));
    };
    const DELETE_TEXT = {
        cascade: 'удаление родителя удалит детей',
        restrict: 'удаление цели запрещено, пока есть ссылка',
        'set-null': 'при удалении цели ссылка станет null',
        unlink: 'при удалении цели id уберётся из набора'
    };
    const KIND_TEXT = { own: 'композиция', ref: 'ссылка', set: 'набор ссылок' };
    const relationTip = (r, field = fieldIndex.get(r.source)?.get(r.field)) => {
        const from = `${r.source}.${r.field}`;
        const del = r.kind === 'own' && r.onDelete === 'restrict'
            ? 'родителя нельзя удалить, пока есть дети'
            : DELETE_TEXT[r.onDelete];
        return (`<b>${esc(from)}</b> <span style="color:${zoneColor(r.kind === 'own' ? r.source : r.target)}">→ ${esc(r.target)}</span>` +
            `<div class="muted">${KIND_TEXT[r.kind]}${r.variant ? ` · только ${esc(r.variant)}` : ''}${r.nullable ? ' · может быть null' : ''}</div>` +
            `<div><span class="del ${esc(r.onDelete)}">${esc(r.onDelete)}</span> ${esc(del)}</div>` +
            decoratorHtml(field?.decorators) +
            (field?.doc ? `<div class="tip-doc">${md(field.doc)}</div>` : ''));
    };
    const moveTip = (x, y) => {
        const rect = tip.getBoundingClientRect();
        const left = Math.min(x + 14, window.innerWidth - rect.width - 8);
        const top = y + 18 + rect.height > window.innerHeight ? y - rect.height - 12 : y + 18;
        tip.style.left = `${Math.max(8, left)}px`;
        tip.style.top = `${Math.max(8, top)}px`;
    };
    const showTip = (html, e) => {
        tip.innerHTML = html;
        tip.hidden = false;
        moveTip(e.clientX, e.clientY);
    };
    function hideTip() {
        tip.hidden = true;
    }
    const applySearch = () => {
        const q = state.query.trim().toLowerCase();
        svg.classList.toggle('has-search', q !== '');
        let count = 0;
        cardEls.forEach((el, key) => {
            const match = q !== '' && haystack.get(key).some((s) => s.includes(q));
            el.classList.toggle('match', match);
            if (match)
                count++;
            el.querySelectorAll('.xv-row').forEach((row) => {
                row.classList.toggle('match', q !== '' && (row.dataset.path || '').toLowerCase().includes(q));
            });
        });
        $('#xv-search-count').textContent = q ? String(count) : '';
    };
    search.addEventListener('input', () => {
        state.query = search.value;
        applySearch();
    });
    search.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const q = state.query.trim().toLowerCase();
            const exact = DATA.entities.find((x) => x.key.toLowerCase() === q);
            const first = exact ?? DATA.entities.find((x) => haystack.get(x.key).some((s) => s.includes(q)));
            if (first)
                select(first.key, { reveal: true });
        }
        else if (e.key === 'Escape') {
            search.value = '';
            state.query = '';
            applySearch();
            search.blur();
        }
    });
    const applyHubMode = () => {
        svg.classList.toggle('mode-shortcuts', state.hubMode === 'shortcuts');
        document.querySelectorAll('[data-hub-mode]').forEach((b) => {
            b.setAttribute('aria-pressed', String(b.dataset.hubMode === state.hubMode));
        });
        try {
            localStorage.setItem('xv-hub-mode', state.hubMode);
        }
        catch { }
        applyFocus();
    };
    document.querySelectorAll('[data-hub-mode]').forEach((b) => b.addEventListener('click', () => {
        state.hubMode = b.dataset.hubMode;
        applyHubMode();
    }));
    const displayType = (f) => {
        const ts = f.tsType ? f.tsType.replace(/\s*\|\s*null$/, '') : '';
        return ts && ts !== f.type ? ts : f.type || '';
    };
    const embeddedCount = (fields) => fields.reduce((n, f) => n + (f.kind === 'embedded' ? 1 + embeddedCount(f.fields || []) : 0), 0);
    const listText = (items, max = 4) => items.length > max
        ? `${items.slice(0, max).join(', ')} и ещё ${items.length - max}`
        : items.join(', ');
    const impactLines = (key) => {
        const children = outgoing.get(key).filter((r) => r.kind === 'own');
        const refsIn = incoming.get(key).filter((r) => r.kind !== 'own');
        const blocked = [
            ...children.filter((r) => r.onDelete === 'restrict').map((r) => r.target),
            ...refsIn.filter((r) => r.onDelete === 'restrict').map((r) => `${r.source}.${r.field}`)
        ];
        const cascade = children.filter((r) => r.onDelete === 'cascade').map((r) => r.target);
        const soft = refsIn.filter((r) => r.onDelete !== 'restrict').map((r) => `${r.source}.${r.field}`);
        const lines = [];
        if (blocked.length)
            lines.push(`<span class="del restrict">restrict</span> запрещено, пока есть ${esc(listText(blocked))}`);
        if (cascade.length)
            lines.push(`<span class="del cascade">cascade</span> удалятся вместе: ${esc(listText(cascade))}`);
        if (soft.length)
            lines.push(`<span class="del set-null">set-null</span> обнулятся или отвяжутся: ${esc(listText(soft))}`);
        return lines.length ? lines : ['удаляется без последствий: на неё не ссылаются, состава нет'];
    };
    const modelTip = (key) => {
        const e = byKey.get(key);
        if (!e)
            return '';
        const zone = zoneById.get(DATA.zoneOf[key]);
        const blocks = embeddedCount(e.fields) + e.variants.reduce((n, v) => n + embeddedCount(v.fields), 0);
        const meta = [
            `ключ <code>${esc(e.idKey)}: ${esc(e.idType)}</code>`,
            plural(fieldCount(e), ['поле', 'поля', 'полей']),
            blocks ? plural(blocks, ['embedded-блок', 'embedded-блока', 'embedded-блоков']) : ''
        ].filter(Boolean);
        const links = `связей: исходящих ${outgoing.get(key).length}, входящих ${incoming.get(key).length}${hubs.has(key) ? `; хаб — ссылаются ${DATA.sources[key]} коллекций` : ''}`;
        return (`<b>${esc(key)}</b>` +
            (zone
                ? ` <span class="tip-zone" style="color: var(${zone.colorVar})">${esc(zone.id)} · ${esc(zone.title)}</span>`
                : '') +
            `<div class="muted">модель ${esc(e.model)} · ${esc(e.file)}${e.namespace ? ` · ${esc(e.namespace)}` : ''}</div>` +
            decoratorHtml(e.decorators) +
            (e.doc ? `<div class="tip-doc">${md(e.doc)}</div>` : '') +
            `<div class="tip-meta">${meta.join(' · ')}</div>` +
            `<div class="tip-meta">${links}</div>` +
            (e.variants.length
                ? `<div class="tip-meta">варианты <code>${esc(e.discriminatorKey)}</code>: ${e.variants
                    .map((v) => `${esc(v.value)} — ${esc(v.model)}`)
                    .join(', ')}</div>`
                : '') +
            `<div class="tip-impact"><div class="muted">при удалении записи</div>${impactLines(key)
                .map((line) => `<div>${line}</div>`)
                .join('')}</div>`);
    };
    const legendEl = $('#xv-legend');
    const legendButton = $('#xv-legend-toggle');
    const legendHtml = () => {
        const sample = (inner) => `<svg width="44" height="14" viewBox="0 0 44 14" aria-hidden="true">${inner}</svg>`;
        const line = (dash = '') => `<line x1="2" y1="7" x2="33" y2="7" stroke="currentColor" stroke-width="1.4"${dash}/>`;
        const arrow = (fill) => `<path d="M42,7 L33,2.5 L33,11.5 Z" fill="${fill}" stroke="currentColor" stroke-width="1.2"/>`;
        const diamond = (fill) => `<path d="M2,7 L9.5,2.5 L17,7 L9.5,11.5 Z" fill="${fill}" stroke="currentColor"/><line x1="17" y1="7" x2="42" y2="7" stroke="currentColor" stroke-width="2"/>`;
        const items = [
            [
                sample(line() + arrow('currentColor')),
                'Ссылка',
                'обязательная, удаление цели запрещено (restrict)'
            ],
            [sample(line() + arrow('var(--xv-surface)')), 'Полая стрелка', 'ссылка может быть null'],
            [
                sample(line(' stroke-dasharray="5 4"') + arrow('var(--xv-surface)')),
                'Пунктир',
                'при удалении цели ссылка обнулится или уйдёт из набора'
            ],
            [
                sample(`<path d="M2,2 L12,7 L2,12 M2,7 L12,7" fill="none" stroke="currentColor" stroke-width="1.2"/>` +
                    `<line x1="12" y1="7" x2="33" y2="7" stroke="currentColor" stroke-width="1.4"/>` +
                    arrow('currentColor')),
                'Воронья лапка',
                'набор ссылок: массив id в поле'
            ],
            [sample(diamond('currentColor')), 'Ромб', 'композиция: дети удалятся вместе с родителем'],
            [
                sample(diamond('var(--xv-surface)')),
                'Полый ромб',
                'композиция: родителя нельзя удалить, пока есть дети'
            ],
            [
                sample(`<defs><pattern id="xv-lg-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.45"/></pattern></defs>` +
                    `<rect x="1.5" y="1.5" width="41" height="11" rx="1" fill="url(#xv-lg-hatch)" stroke="currentColor" stroke-opacity="0.5"/>`),
                'Штриховка',
                'embedded-блок: часть документа, не отдельная коллекция'
            ],
            [
                sample(`<rect x="1.5" y="1.5" width="41" height="11" rx="1" fill="currentColor" fill-opacity="0.18"/>`),
                'Сплошная полоса',
                'вариант дискриминатора: ниже поля только этого типа'
            ]
        ];
        let html = `<div class="lg-head"><b>Легенда</b><button type="button" class="lg-close" data-close aria-label="Закрыть легенду">×</button></div>`;
        html += `<p class="quiet">${plural(DATA.entities.length, ['коллекция', 'коллекции', 'коллекций'])}, ${plural(DATA.relations.length, ['связь', 'связи', 'связей'])}. Линия выходит из строки поля и окрашена в цвет зоны, куда ведёт.</p>`;
        html += '<section><h3>Обозначения</h3><div class="legend">';
        html += items
            .map(([svgHtml, title, hint]) => `<div class="lg">${svgHtml}<span>${title}<small>${hint}</small></span></div>`)
            .join('');
        html += '</div></section><section><h3>Зоны</h3><div class="zones">';
        html += DATA.zones
            .map((z) => {
            const count = DATA.entities.filter((e) => DATA.zoneOf[e.key] === z.id).length;
            return `<button type="button" class="zone-row" data-zone="${esc(z.id)}" style="--t: var(${z.colorVar})"><span class="zone-dot"></span><span>${esc(z.id)} · ${esc(z.title)}</span><span class="quiet">${count}</span></button>`;
        })
            .join('');
        html += '</div></section>';
        if (hubs.size) {
            html += `<section><h3>Хабы</h3><p class="quiet">${[...hubs]
                .map((h) => `<button type="button" class="ent-link" data-key="${esc(h)}" style="--t:${zoneColor(h)}">${esc(h)}</button> — ${DATA.sources[h]} источников`)
                .join(', ')}. В режиме «Ярлыки» их связи не рисуются линиями: цель видна в строке поля, а линия появляется при выделении.</p></section>`;
        }
        html +=
            '<section><h3>Как пользоваться</h3><ul class="keys">' +
                '<li>наведение на шапку модели — описание модели, на поле — тип, декоратор и JSDoc</li>' +
                '<li>клик по шапке — закрепить связи модели, по полю — связи поля; повторный клик снимает</li>' +
                '<li><kbd>/</kbd>поиск по коллекциям и полям</li><li><kbd>0</kbd>вписать карту</li>' +
                '<li><kbd>?</kbd>легенда</li><li><kbd>Esc</kbd>сбросить выделение</li></ul></section>';
        html += `<p class="quiet foot">Собрано ${esc(new Date(DATA.generatedAt).toLocaleString('ru-RU'))}</p>`;
        return html;
    };
    function setLegend(open) {
        legendEl.hidden = !open;
        legendButton.setAttribute('aria-expanded', String(open));
        try {
            localStorage.setItem('xv-legend', open ? 'open' : 'closed');
        }
        catch { }
    }
    legendEl.innerHTML = legendHtml();
    legendButton.addEventListener('click', () => setLegend(legendEl.hidden));
    legendEl.addEventListener('click', (e) => {
        const target = e.target;
        if (target.closest('[data-close]'))
            return setLegend(false);
        const zone = target.closest('[data-zone]');
        if (zone)
            return revealZone(zone.dataset.zone);
        const item = target.closest('[data-key]');
        if (item)
            select(item.dataset.key, { reveal: true });
    });
    function select(key, options = {}) {
        state.pin = null;
        state.beforePin = null;
        state.hover = null;
        state.hoverEdge = null;
        state.selected = key && byKey.has(key) ? key : null;
        try {
            history.replaceState(null, '', state.selected ? `#${state.selected}` : location.pathname + location.search);
        }
        catch { }
        applyFocus();
        if (state.selected && options.reveal)
            reveal(state.selected);
    }
    document.addEventListener('keydown', (e) => {
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
        if (typing)
            return;
        if (e.key === '/') {
            e.preventDefault();
            search.focus();
            search.select();
        }
        else if (e.key === 'Escape') {
            select(null);
        }
        else if (e.key === '?') {
            setLegend(legendEl.hidden);
        }
        else if (e.key === '0') {
            fitAll();
        }
        else if (e.key === '+' || e.key === '=' || e.key === '-') {
            const factor = e.key === '-' ? 1 / 1.25 : 1.25;
            const w = stage.clientWidth / view.k;
            const h = stage.clientHeight / view.k;
            const k = Math.max(MIN_K, Math.min(MAX_K, view.k * factor));
            animateTo({
                x: view.x + w / 2 - stage.clientWidth / 2 / k,
                y: view.y + h / 2 - stage.clientHeight / 2 / k,
                k
            });
        }
    });
    const onTheme = () => applyView();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
    let legendOpen = false;
    try {
        legendOpen = localStorage.getItem('xv-legend') === 'open';
    }
    catch { }
    setLegend(legendOpen);
    let restore = null;
    try {
        restore = JSON.parse(sessionStorage.getItem('xv-restore') || 'null');
        sessionStorage.removeItem('xv-restore');
    }
    catch { }
    applyHubMode();
    if (restore?.view) {
        Object.assign(view, restore.view);
        applyView();
    }
    else
        fitAll(false);
    let stageSize = { w: stage.clientWidth, h: stage.clientHeight };
    new ResizeObserver(() => {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        if (!w || !h)
            return;
        view.x += (stageSize.w - w) / 2 / view.k;
        view.y += (stageSize.h - h) / 2 / view.k;
        stageSize = { w, h };
        applyView();
    }).observe(stage);
    const params = new URLSearchParams(location.search);
    const query = restore ? restore.query : params.get('q');
    if (query) {
        search.value = query;
        state.query = query;
        applySearch();
    }
    if (restore) {
        if (restore.pin && byKey.has(restore.pin.key)) {
            togglePin(restore.pin.key, restore.pin.path);
            state.beforePin = restore.beforePin ?? null;
        }
        else if (restore.selected && byKey.has(restore.selected)) {
            select(restore.selected);
        }
    }
    else {
        const fromHash = decodeURIComponent(location.hash.slice(1));
        if (byKey.has(fromHash))
            select(fromHash, { reveal: true });
        const pinParam = params.get('pin');
        if (pinParam && pinParam.includes('.')) {
            const dot = pinParam.indexOf('.');
            if (byKey.has(pinParam.slice(0, dot)))
                togglePin(pinParam.slice(0, dot), pinParam.slice(dot + 1));
        }
    }
    if (params.get('hubs') === 'shortcuts' || params.get('hubs') === 'lines') {
        state.hubMode = params.get('hubs');
        applyHubMode();
    }
    ;
    window.__xv = {
        state: () => ({
            view: { ...view },
            selected: state.selected,
            pin: state.pin,
            beforePin: state.beforePin,
            query: state.query
        })
    };
    if (DEBUG) {
        const out = $('#xv-debug');
        const sample = DATA.entities[0];
        out.hidden = false;
        out.textContent = JSON.stringify({
            errors,
            cards: cardEls.size,
            edgesAll: layer('all').querySelectorAll('.xv-edge').length,
            edgesNohub: layer('nohub').querySelectorAll('.xv-edge').length,
            selected: state.selected,
            pin: state.pin,
            locked: svg.classList.contains('is-locked'),
            focusedEdges: svg.querySelectorAll('.xv-edge.is-on').length,
            focusedCards: svg.querySelectorAll('.xv-card.is-on').length,
            searchMatches: svg.querySelectorAll('.xv-card.match').length,
            restored: Boolean(restore),
            floats: [...document.querySelectorAll('.xv-float')].map((el) => {
                const r = el.getBoundingClientRect();
                return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];
            }),
            stage: { w: stage.clientWidth, h: stage.clientHeight },
            view: { ...view },
            lod: svg.classList.contains('lod-far'),
            hubMode: state.hubMode,
            legend: legendEl.hidden ? 'closed' : 'open',
            blockRows: svg.querySelectorAll('.xv-row.block').length,
            variantRows: svg.querySelectorAll('.xv-row.variant').length,
            modelTip: sample
                ? modelTip(sample.key)
                    .replace(/<[^>]+>/g, ' ')
                    .replace(/\s+/g, ' ')
                    .slice(0, 300)
                : ''
        });
    }
})();
</script>
