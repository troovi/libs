name: publish-packages
on:
  push:
    branches:
      - master

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      utils-js: ${{ steps.filter.outputs.utils-js }}
      utils-browser: ${{ steps.filter.outputs.utils-browser }}
      utils-nodejs: ${{ steps.filter.outputs.utils-nodejs }}
      utils-math: ${{ steps.filter.outputs.utils-math }}
      repulse: ${{ steps.filter.outputs.repulse }}
      formkit: ${{ steps.filter.outputs.formkit }}
      uikit: ${{ steps.filter.outputs.uikit }}
      icons-solid: ${{ steps.filter.outputs.icons-solid }}
      icons-regular: ${{ steps.filter.outputs.icons-regular }}
      icons-brands: ${{ steps.filter.outputs.icons-brands }}
      xeo-scheme: ${{ steps.filter.outputs.xeo-scheme }}
      xeo-server: ${{ steps.filter.outputs.xeo-server }}
      xeo-react: ${{ steps.filter.outputs.xeo-react }}
      xeo-toolkit: ${{ steps.filter.outputs.xeo-toolkit }}
      xeo-types: ${{ steps.filter.outputs.xeo-types }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            utils-js:
              - 'packages/utils-js/package.json'
            utils-browser:
              - 'packages/utils-browser/package.json'
            utils-nodejs:
              - 'packages/utils-nodejs/package.json'
            utils-math:
              - 'packages/utils-math/package.json'
            repulse:
              - 'packages/repulse/package.json'
            formkit:
              - 'packages/formkit/package.json'
            uikit:
              - 'packages/uikit/package.json'
            icons-solid:
              - 'icons/solid/package.json'
            icons-regular:
              - 'icons/regular/package.json'
            icons-brands:
              - 'icons/brands/package.json'
            xeo-scheme:
              - 'xeo/scheme/package.json'
            xeo-server:
              - 'xeo/server/package.json'
            xeo-react:
              - 'xeo/react/package.json'
            xeo-toolkit:
              - 'xeo/toolkit/package.json'
            xeo-types:
              - 'xeo/types/package.json'

      - run: echo '${{ toJson(github.event) }}'

  utils-js:
    needs: changes
    if: ${{ needs.changes.outputs.utils-js == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspace=@companix/utils-js
      - run: npm run github:setup
      - run: npm publish --access public
        working-directory: packages/utils-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  utils-browser:
